# ============================================================
# YT Daily Shorts — Default Settings
# Override via env vars (YT_ prefix) or config/settings.local.yaml.
# ============================================================

general:
  project_name: "yt-daily-shorts"
  channel_name: "Daily Hindi Shorts"   # override with repo variable YT_CHANNEL_NAME
  timezone: "Asia/Kolkata"
  daily_video_count: 2
  max_video_count: 3
  dry_run: true          # GitHub scheduled runs set YT_DRY_RUN=false
  strict_mode: false     # forced ON automatically when dry_run is false
  debug: false

llm:
  # Tried in order. Providers without a key are skipped; a failing
  # provider/model falls through to the next one.
  provider_order: ["gemini", "groq", "openrouter", "mistral", "nvidia", "ollama"]
  models:
    gemini: ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-flash-latest", "gemini-2.5-flash"]
    groq: ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]
    mistral: ["mistral-medium-latest", "mistral-small-latest"]
    openrouter: ["auto-free"]   # picks currently available ':free' models
    nvidia: []   # old NIM models returned 410 Gone (Nov 2026); add a current model id to enable
    ollama: []   # Ollama Cloud needs paid credits (HTTP 402); add models after subscribing
  temperature: 0.7
  max_tokens: 4096
  timeout_sec: 90

video:
  width: 1080
  height: 1920
  fps: 30
  target_duration: 52
  min_duration: 25
  max_duration: 59
  output_format: "mp4"
  background_music: true
  music_volume: 0.10

editorial_calendar:
  monday: "Indian Politics and Political Leaders"
  tuesday: "Science and Technology"
  wednesday: "Medical Science and Scientific Research"
  thursday: "Great Personalities and Biographies"
  friday: "Indian History, Monuments, Temples and Heritage"
  saturday: "Interesting Facts, Inventions and Discoveries"
  sunday: "Economy, Society and World Affairs"

tts:
  provider: "edge-tts"
  voice: "hi-IN-MadhurNeural"
  fallback_voice: "hi-IN-SwaraNeural"
  rate: "+8%"
  pitch: "+0Hz"

seo:
  max_title_length: 100
  max_description_length: 5000
  default_hashtags:
    - "#shorts"
    - "#hindi"
    - "#india"
    - "#facts"
    - "#knowledge"

youtube:
  default_privacy: "public"     # override with repo variable YT_YOUTUBE_PRIVACY
  news_category_id: "25"        # News & Politics
  knowledge_category_id: "27"   # Education
  contains_synthetic_media: true

telegram:
  send_video: true
