name: Daily YouTube Shorts Production

on:
  schedule:
    # Morning News Short: 05:30 AM IST (00:00 UTC)
    - cron: '0 0 * * *'
    # Knowledge / Explainer Short: 02:30 PM IST (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Which video type to generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - news
          - knowledge
      dry_run:
        description: 'Run in DRY_RUN mode (skip actual YouTube upload)'
        required: true
        default: true
        type: boolean

concurrency:
  group: daily-shorts-production
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Shorts Automation Pipeline
        env:
          YT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YT_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YT_YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          YT_CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          YT_CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          YT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python main.py --video-type ${{ github.event.inputs.video_type || 'all' }}

      - name: Upload Video Artifacts and Production Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-artifacts-${{ github.run_number }}
          path: |
            output/
            data/logs/
            data/yt_shorts.db
          retention-days: 7

      - name: Send Telegram Failure Alert
        if: failure()
        env:
          YT_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YT_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.environ.get('YT_TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('YT_TELEGRAM_CHAT_ID')
          if token and chat_id:
              text = '🚨 *YouTube Shorts Production Workflow FAILED!*\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': text, 'parse_mode': 'Markdown'})
          "
