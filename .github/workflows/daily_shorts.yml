name: Daily YouTube Shorts Production

on:
  schedule:
    # Morning News Short. Primary trigger = Hark daily task (04:00 IST dispatch + 06:15 IST check/retry),
    # because GitHub cron can run hours late. This cron is only a backup; the gate job skips it
    # when today's live video already succeeded.
    - cron: '17 23 * * *'   # 04:47 IST backup
    # Knowledge / Explainer Short: PAUSED 2026-11-08 (focus on news). Re-enable:
    # - cron: '0 9 * * *'   # 02:30 PM IST (09:00 UTC)
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Which video to generate'
        required: true
        default: 'news'
        type: choice
        options: [news, knowledge, all]
      dry_run:
        description: 'DRY RUN (render + Telegram preview, no YouTube upload)'
        required: true
        default: true
        type: boolean
      force_upload:
        description: 'Upload even if today video of this type is already on the channel'
        required: false
        default: false
        type: boolean
      llm_check:
        description: 'Only test LLM providers (no video)'
        required: false
        default: false
        type: boolean

run-name: "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && 'dry-run' || 'live' }} ${{ github.event.inputs.video_type || 'news' }} (${{ github.event_name }})"

concurrency:
  group: daily-shorts-production
  cancel-in-progress: false

permissions:
  contents: write  # permanent state is saved to the 'state' branch
  actions: write   # needed to save the state cache

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip backup cron if today's live video is already done
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
            N=$(gh api "repos/${{ github.repository }}/actions/workflows/daily_shorts.yml/runs?per_page=20" \
              --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion == \"success\")
                     | select(.display_title | startswith(\"live\"))
                     | select((.created_at | fromdateiso8601 + 19800 | strftime(\"%Y-%m-%d\")) == \"$TODAY\")] | length")
            if [ "${N:-0}" -gt 0 ]; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP"

  produce-and-publish:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'
      YT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YT_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      YT_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      YT_GEMINI_API_KEYS_EXTRA: ${{ secrets.GEMINI_API_KEYS_EXTRA }}
      YT_GROQ_API_KEYS_EXTRA: ${{ secrets.GROQ_API_KEYS_EXTRA }}
      YT_OPENROUTER_API_KEYS_EXTRA: ${{ secrets.OPENROUTER_API_KEYS_EXTRA }}
      YT_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      YT_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      YT_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YT_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YT_YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YT_PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      YT_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      YT_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      YT_NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      YT_GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      YT_UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      YT_FORCE_UPLOAD: ${{ github.event.inputs.force_upload || 'false' }}
      YT_HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Failover key pools: provider -> YT_<PROVIDER>_API_KEY_2..9
      # (a quota-exhausted or revoked key falls through to the next one)
      YT_GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      YT_GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      YT_GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      YT_GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      YT_GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      YT_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      YT_OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      YT_MAX_KEYS_PER_PROVIDER: ${{ vars.YT_MAX_KEYS_PER_PROVIDER || '2' }}
      # Optional repository variables (Settings -> Secrets and variables -> Variables)
      YT_YOUTUBE_PRIVACY: ${{ vars.YT_YOUTUBE_PRIVACY }}
      YT_CHANNEL_NAME: ${{ vars.YT_CHANNEL_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then TYPE=knowledge; else TYPE=news; fi
            DRY=false
          else
            TYPE="${{ github.event.inputs.video_type }}"
            DRY="${{ github.event.inputs.dry_run }}"
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "Video type: $TYPE | dry run: $DRY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg > /dev/null && break
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache 3D photo depth model
        uses: actions/cache@v4
        with:
          path: ~/.cache/bks-depth
          key: depth-anything-v2-small-onnx-v1

      - name: LLM provider check
        if: github.event.inputs.llm_check == 'true'
        run: python main.py --llm-check

      - name: Restore pipeline state (history + DB)
        if: github.event.inputs.llm_check != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history.json
            data/yt_shorts.db
            data/editor_memory.json
          key: yt-state-${{ github.run_id }}
          restore-keys: yt-state-

      - name: Restore permanent state (state branch wins over cache)
        if: github.event.inputs.llm_check != 'true'
        run: |
          mkdir -p data
          if git fetch -q origin state 2>/dev/null; then
            for f in history.json editor_memory.json yt_shorts.db; do
              git show "FETCH_HEAD:$f" > "/tmp/$f" 2>/dev/null && [ -s "/tmp/$f" ] && mv "/tmp/$f" "data/$f" && echo "restored $f"
            done
          else
            echo "no state branch yet (first run)"
          fi

      - name: Produce & publish (auto-retry once)
        if: github.event.inputs.llm_check != 'true'
        env:
          YT_DRY_RUN: ${{ steps.mode.outputs.dry }}
        run: |
          # A retry can never double-upload: the publisher checks the channel for today's publish key first.
          python main.py --video-type ${{ steps.mode.outputs.type }} && exit 0
          echo "::warning::first attempt failed, retrying in 90s"
          sleep 90
          python main.py --video-type ${{ steps.mode.outputs.type }}

      - name: Save permanent state (state branch)
        if: always() && github.event.inputs.llm_check != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          W="$GITHUB_WORKSPACE"; D=$(mktemp -d); cd "$D"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q origin state 2>/dev/null; then git checkout -q -b state FETCH_HEAD; else git checkout -q --orphan state; fi
          for f in history.json editor_memory.json yt_shorts.db; do [ -s "$W/data/$f" ] && cp "$W/data/$f" .; done
          git add -A
          git -c user.name=yt-shorts-bot -c user.email=yt-shorts-bot@users.noreply.github.com \
            commit -qm "state after run ${{ github.run_id }}" && git push -q origin state || echo "state unchanged"

      - name: Save pipeline state
        if: always() && github.event.inputs.llm_check != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/history.json
            data/yt_shorts.db
            data/editor_memory.json
          key: yt-state-${{ github.run_id }}

      - name: Upload artifacts
        if: always() && github.event.inputs.llm_check != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ steps.mode.outputs.type }}-${{ github.run_number }}
          path: |
            output/*/final_short.mp4
            output/*/thumbnail.jpg
            output/*/voiceover.m4a
            output/*/timings.json
            output/*/captions.srt
            output/*/editor_sheet.jpg
            data/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Telegram alert on workflow crash
        if: failure()
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("YT_TELEGRAM_BOT_TOKEN"), os.environ.get("YT_TELEGRAM_CHAT_ID")
          if t and c:
              url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              requests.post(f"https://api.telegram.org/bot{t}/sendMessage",
                            json={"chat_id": c, "text": f"🚨 YT Shorts workflow FAILED\n{url}"}, timeout=15)
          PY
