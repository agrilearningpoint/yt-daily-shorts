name: Automated Tests & Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (Ruff - syntax errors, undefined names)
        run: |
          pip install -q ruff
          ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Run Pytest Suite with Coverage
        run: |
          pip install -q pytest-cov
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing:skip-covered
